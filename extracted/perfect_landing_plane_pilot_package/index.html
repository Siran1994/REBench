<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perfect Landing Plane Pilot - 本地启动器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #111; font-family: sans-serif;
    }
    #unity-container {
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading-cover {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #181818; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 99; color: #fff;
    }
    .progress-box {
      width: 320px; max-width: 80vw; height: 12px;
      background: #333; border-radius: 6px; overflow: hidden; margin-top: 20px;
    }
    #progress-fill { width: 0%; height: 100%; background: #ff9800; transition: width 0.15s; }
    #status-text { margin-top: 15px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-cover">
      <h2 style="color:#ff9800;">Perfect Landing Plane Pilot</h2>
      <div class="progress-box"><div id="progress-fill"></div></div>
      <div id="status-text">准备加载 WebGL 引擎...</div>
    </div>
  </div>

  <script src="poki-sdk.js"></script>
  <script src="Build/813700ccfaf64a0a3c57e3aa3166490b.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const progressFill = document.querySelector("#progress-fill");
    const statusText = document.querySelector("#status-text");
    const loadingCover = document.querySelector("#loading-cover");

    let bridgeName = null;
    let readySent = false;

    function notifyReady() {
      if (window.unityGame && bridgeName) {
        try {
          window.unityGame.SendMessage(bridgeName, "ready");
          readySent = true;
          console.log("[PokiBridge] Dispatched ready to Unity GameObject: " + bridgeName);
        } catch (e) {
          // Unity object may still be waking up in current frame
        }
      }
    }

    window.initPokiBridge = function(name) {
      bridgeName = name;
      console.log("[PokiBridge] initPokiBridge registered:", name);
      notifyReady();
      var count = 0;
      var timer = setInterval(function() {
        count++;
        notifyReady();
        if (count >= 20) clearInterval(timer);
      }, 200);
    };

    window.commercialBreak = function() {
      if (window.unityGame && bridgeName) {
        try { window.unityGame.SendMessage(bridgeName, "commercialBreakCompleted"); } catch(e) {}
      }
    };
    window.rewardedBreak = function() {
      if (window.unityGame && bridgeName) {
        try { window.unityGame.SendMessage(bridgeName, "rewardedBreakCompleted", "true"); } catch(e) {}
      }
    };

    // Any interaction immediately pulses ready in case AudioContext / Scene init was paused
    window.addEventListener("pointerdown", notifyReady);
    window.addEventListener("keydown", notifyReady);

    createUnityInstance(canvas, {
      dataUrl: "Build/a22d7abc1ee3cd7b71a65e48bb3d9b2e.data.unityweb",
      frameworkUrl: "Build/0b14ddffb6d6867f4577189187985cab.framework.js.unityweb",
      codeUrl: "Build/78675d3236180fa3ceddab8a23a2032e.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Go Games",
      productName: "Perfect Landing Plane Pilot",
      productVersion: "2.2"
    }, function(progress) {
      progressFill.style.width = Math.round(progress * 100) + "%";
      statusText.innerText = "加载中 (" + Math.round(progress * 100) + "%)...";
    }).then(function(instance) {
      window.unityGame = instance;
      loadingCover.style.display = "none";
      notifyReady();
      setTimeout(notifyReady, 500);
      setTimeout(notifyReady, 1200);
    }).catch(function(err) {
      statusText.innerText = "启动异常: " + (err.message || err);
      statusText.style.color = "#f44336";
    });
  </script>
</body>
</html>
